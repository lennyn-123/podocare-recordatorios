name: Recordatorios PodoCare

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: podocare-recordatorios
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Enviar recordatorios pendientes
        env:
          RECORDATORIOS_TOKEN: ${{ secrets.PODOCARE_REMINDERS_TOKEN }}
        run: |
          test -n "$RECORDATORIOS_TOKEN"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $RECORDATORIOS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            'https://podocare-server.onrender.com/api/movil/tareas/recordatorios/'
